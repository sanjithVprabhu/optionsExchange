[workspace]
resolver = "2"
members = [
    "core/primitives",
    "core/instrument",
    "core/oms",
    "core/matching",
    "core/risk",
    "core/settlement",
    "core/wallet",
    "adapters/storage",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Options Exchange Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Ordered floats (for BTreeMap keys in order book)
ordered-float = "4"

# Testing
proptest = "1"
